# Telemetria anônima do Benikids: recebe um envio por dia de cada instalação.
# Publicar: cd telemetria && npx wrangler@3 deploy
name = "benikids-telemetria"
main = "src/index.js"
compatibility_date = "2024-09-23"

# endereço próprio no domínio do projeto (zona benikids.app na mesma conta)
routes = [{ pattern = "telemetria.benikids.app", custom_domain = true }]

[[d1_databases]]
binding = "DB"
database_name = "benikids-telemetria"
database_id = "eeacd775-758a-4c1a-a72e-e5f31e568d17"

# limpeza diária: uso com mais de 12 meses, problemas com mais de 6 meses
[triggers]
crons = ["17 3 * * *"]
