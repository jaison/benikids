<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Ciências (PhET)</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Ubuntu", "Noto Sans", sans-serif;
    background: radial-gradient(circle at 20% 15%, #1e3a8a 0, #0f172a 60%);
    color: #f8fafc;
    display: flex; flex-direction: column; align-items: center;
    gap: 3vh; padding: 4vh 4vw; min-height: 100%;
  }
  h1 { margin: 0; font-size: clamp(28px, 5vh, 48px); text-align: center; }
  .sub { margin: 0; font-size: clamp(16px, 2.6vh, 24px); color: #cbd5e1; text-align: center; }
  .temas {
    display: grid; gap: 2.4vw; width: min(100%, 1250px);
    grid-template-columns: repeat(5, 1fr);
  }
  button.tema, a.sim {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.2vh;
    border: 0; border-radius: 28px; text-decoration: none; color: #fff; cursor: pointer;
    font: inherit; font-weight: 700;
    background: var(--cor); box-shadow: 0 10px 0 var(--sombra), 0 18px 30px rgba(0,0,0,.35);
    transition: transform .12s, box-shadow .12s; outline: none;
  }
  button.tema { aspect-ratio: 3 / 4; }
  a.sim { min-height: 88px; padding: 2vh 1vw; font-size: clamp(18px, 2.6vh, 28px); text-align: center; line-height: 1.15; }
  button.tema:hover, button.tema:focus, a.sim:hover, a.sim:focus {
    transform: translateY(-6px) scale(1.03);
    box-shadow: 0 16px 0 var(--sombra), 0 26px 40px rgba(0,0,0,.4);
  }
  button.tema:focus, a.sim:focus, .voltar:focus { outline: 6px solid #fde047; outline-offset: 4px; }
  button.tema:active, a.sim:active { transform: translateY(6px); box-shadow: 0 4px 0 var(--sombra); }
  .icone { font-size: clamp(56px, 13vh, 120px); line-height: 1; }
  .nome { font-size: clamp(20px, 3.6vh, 34px); font-weight: 700; text-align: center; line-height: 1.1; }
  .fisica   { --cor: #f59e0b; --sombra: #b45309; }
  .mat      { --cor: #3b82f6; --sombra: #1d4ed8; }
  .quimica  { --cor: #a855f7; --sombra: #7e22ce; }
  .terra    { --cor: #06b6d4; --sombra: #0e7490; }
  .bio      { --cor: #22c55e; --sombra: #15803d; }
  .lista { display: none; width: min(100%, 1100px); flex: 1; min-height: 0; overflow: auto; }
  body.na-lista .temas { display: none; }
  body.na-lista .lista { display: block; }
  .grade { display: grid; gap: 1.6vh 1.4vw; grid-template-columns: repeat(3, 1fr); padding-bottom: 4vh; }
  .voltar {
    border: 0; border-radius: 999px; background: #1e293b; color: #f8fafc;
    font: inherit; font-weight: 700; font-size: clamp(18px, 2.8vh, 28px);
    padding: 1.2vh 2vw; cursor: pointer; margin: 0 0 2vh;
  }
  .aviso { font-size: clamp(18px, 3vh, 28px); text-align: center; max-width: 40rem; }
  @media (max-width: 800px) {
    .temas { grid-template-columns: repeat(3, 1fr); }
    .grade { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <h1 id="titulo">🔬 O que você quer explorar hoje?</h1>
  <p class="sub" id="sub">Experimentos de ciências do PhET para o Ensino Fundamental 1</p>
  <nav class="temas" id="temas">
    <button type="button" class="tema fisica"  data-tema="physics"><span class="icone">⚡</span><span class="nome">Física</span></button>
    <button type="button" class="tema mat"     data-tema="math-and-statistics"><span class="icone">🔢</span><span class="nome">Matemática</span></button>
    <button type="button" class="tema quimica" data-tema="chemistry"><span class="icone">🧪</span><span class="nome">Química</span></button>
    <button type="button" class="tema terra"   data-tema="earth-and-space"><span class="icone">🌍</span><span class="nome">Terra e Espaço</span></button>
    <button type="button" class="tema bio"     data-tema="biology"><span class="icone">🌱</span><span class="nome">Biologia</span></button>
  </nav>
  <div class="lista" id="lista"></div>
<script>
  // Ensino Fundamental 1. A lista (phet-sims.json) só tem simulações HTML desse
  // nível, cada uma em /sims/html/. Não abre o site do PhET, o login nem a doação.
  var PREFIXO = "https://phet.colorado.edu/sims/html/";
  var temas = document.querySelectorAll("button.tema");
  var lista = document.getElementById("lista");
  var dados = null;
  var i = 0;

  function simSeguro(url) {
    return typeof url === "string" && url.indexOf(PREFIXO) === 0;
  }

  function voltar() {
    document.body.classList.remove("na-lista");
    document.getElementById("titulo").textContent = "🔬 O que você quer explorar hoje?";
    document.getElementById("sub").textContent = "Experimentos de ciências do PhET para o Ensino Fundamental 1";
    temas[i].focus();
  }

  function abrirTema(botao) {
    if (!dados) return;
    var tema = botao.dataset.tema;
    var sims = (dados.temas && dados.temas[tema]) || [];
    lista.innerHTML = "";
    var voltarBtn = document.createElement("button");
    voltarBtn.type = "button";
    voltarBtn.className = "voltar";
    voltarBtn.textContent = "‹ Matérias";
    voltarBtn.addEventListener("click", voltar);
    lista.appendChild(voltarBtn);
    var grade = document.createElement("div");
    grade.className = "grade";
    sims.forEach(function (item) {
      if (!item || !simSeguro(item.url)) return;
      var a = document.createElement("a");
      a.className = "sim " + botao.className.replace("tema", "").trim();
      a.href = item.url;
      a.textContent = item.nome || "Experimento";
      grade.appendChild(a);
    });
    lista.appendChild(grade);
    document.body.classList.add("na-lista");
    document.getElementById("titulo").textContent = botao.querySelector(".nome").textContent;
    document.getElementById("sub").textContent = "Toque num experimento";
    voltarBtn.focus();
  }

  temas.forEach(function (botao) { botao.addEventListener("click", function () { abrirTema(botao); }); });
  temas[0].focus();
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && document.body.classList.contains("na-lista")) {
      voltar();
      e.preventDefault();
      return;
    }
    if (document.body.classList.contains("na-lista")) return;
    if (e.key === "ArrowRight" || e.key === "ArrowDown") i = (i + 1) % temas.length;
    else if (e.key === "ArrowLeft" || e.key === "ArrowUp") i = (i + temas.length - 1) % temas.length;
    else return;
    temas[i].focus();
    e.preventDefault();
  });

  fetch("phet-sims.json")
    .then(function (r) { if (!r.ok) throw new Error("lista"); return r.json(); })
    .then(function (json) { dados = json; })
    .catch(function () {
      var p = document.createElement("p");
      p.className = "aviso";
      p.textContent = "Não deu para carregar os experimentos. Feche e abra de novo.";
      document.body.appendChild(p);
    });
</script>
</body>
</html>
