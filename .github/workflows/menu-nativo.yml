name: Menu nativo

# Compila o menu nativo (cliente/, Rust + gpui-fast) e, numa Release publicada,
# anexa o binário (beni-menu-linux-x86_64 + .sha256). O atualizador dos
# notebooks (beni/sistema/beni-atualizar) baixa esse binário junto com o pacote.
# Compila no Ubuntu 22.04 (glibc 2.35) para rodar também no Mint 21.
on:
  push:
    branches: [main, develop]
    paths: ["cliente/**", "src/**", "tests/ajudantes/**", "tests/test_janela_travada_windows.py", "themes/**", "scripts/windows/**", "beni/config/config.json", "VERSION", ".github/workflows/menu-nativo.yml"]
  pull_request:
    paths: ["cliente/**", "src/**", "tests/ajudantes/**", "tests/test_janela_travada_windows.py", "themes/**", "scripts/windows/**", "beni/config/config.json", "VERSION", ".github/workflows/menu-nativo.yml"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compilar:
    name: Compilar beni-menu
    runs-on: ubuntu-22.04
    permissions:
      contents: write   # só usado para anexar o binário na Release
    steps:
      - uses: actions/checkout@v7

      - name: Bibliotecas do sistema (X11, fontes, Vulkan/GL)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libxkbcommon-x11-dev libxkbcommon-dev libx11-xcb-dev libxcb1-dev \
            libfontconfig-dev libfreetype-dev libvulkan-dev libzstd-dev \
            libwayland-dev clang cmake pkg-config

      - name: Rust estável
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            cliente/target
          key: menu-nativo-${{ runner.os }}-${{ hashFiles('cliente/Cargo.lock', 'cliente/vendor/**') }}
          restore-keys: menu-nativo-${{ runner.os }}-

      - name: Testes
        working-directory: cliente
        run: cargo test --locked --release

      - name: Compilar (perfil dist)
        working-directory: cliente
        run: |
          cargo build --locked --profile dist
          ls -la target/dist/beni-menu
          ./target/dist/beni-menu --versao
          mkdir -p ../saida
          cp target/dist/beni-menu ../saida/beni-menu-linux-x86_64
          cd ../saida && sha256sum beni-menu-linux-x86_64 > beni-menu-linux-x86_64.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: beni-menu-linux-x86_64
          path: saida/
          if-no-files-found: error

      - name: Anexar à Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            saida/beni-menu-linux-x86_64 saida/beni-menu-linux-x86_64.sha256 --clobber

  windows:
    name: Compilar beni-menu (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Rust estável
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            cliente/target
          key: menu-nativo-${{ runner.os }}-${{ hashFiles('cliente/Cargo.lock', 'cliente/vendor/**') }}
          restore-keys: menu-nativo-${{ runner.os }}-

      - name: Testes
        working-directory: cliente
        run: cargo test --locked --release

      - name: Compilar (perfil dist)
        working-directory: cliente
        shell: bash
        run: |
          cargo build --locked --profile dist
          mkdir -p ../saida
          # o nome com "demo" abre o modo demonstração com dois cliques
          cp target/dist/beni-menu.exe ../saida/beni-menu-demo.exe
          mkdir -p ../saida-pacote
          cp target/dist/beni-menu.exe ../saida-pacote/beni-menu.exe

      - uses: actions/upload-artifact@v7
        with:
          name: beni-menu-windows-demo
          path: saida/
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: beni-menu-windows
          path: saida-pacote/
          if-no-files-found: error

  # Roteiro 34: uma janela Win32 travada de verdade (tests/ajudantes/janela_travada.py)
  # e o vigia da pílula fechando o app em 30 s (aqui, 4 s). No PC de teste não dá para
  # provocar o "Não respondendo". O ajudante fica em tests/ e não entra no pacote.
  app-travado-windows:
    name: App travado (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Vigia fecha a janela travada
        run: python -m unittest -v tests.test_janela_travada_windows

  # Pacote para Windows: launcher (o mesmo servidor Python do Linux) + Python
  # embutido (python-build-standalone, com Tk) + menu nativo + configuração inicial.
  pacote-windows:
    name: Pacote Windows
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write   # só usado para anexar o pacote na Release
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: beni-menu-windows
          path: menu/

      - name: Montar o pacote
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          P=pacote/Beni
          mkdir -p "$P/app/themes/fonts" "$P/app/themes/themes"
          cp -r src/. "$P/app/"
          rm -rf "$P/app/launcher.sh" "$P/app/update.sh" "$P/app/__pycache__" "$P/app/scratch"
          cp themes/*.jpg themes/*.svg "$P/app/themes/"
          cp themes/fonts/* "$P/app/themes/fonts/"
          cp themes/*.jpg "$P/app/themes/themes/"
          tr -d ' \n' < VERSION > "$P/app/version"
          cp menu/beni-menu.exe "$P/app/"
          python3 scripts/windows/config-padrao.py "$P/config-padrao.json"
          cp scripts/windows/instalar_windows.py "$P/"
          # pythonw: sem a janela preta do console (os avisos do instalador são janelas)
          printf '@echo off\r\nstart "" "%%~dp0python\\pythonw.exe" "%%~dp0instalar_windows.py"\r\n' > "$P/Instalar Benikids.cmd"
          # Python 3.13 para Windows com Tk (o "embeddable" oficial não traz o tkinter)
          ASSET=$(gh release view -R astral-sh/python-build-standalone --json assets --jq '.assets[].name' \
            | grep -E '^cpython-3\.13\.[0-9]+\+[0-9]+-x86_64-pc-windows-msvc-install_only\.tar\.gz$' | head -1)
          echo "Python: $ASSET"
          gh release download -R astral-sh/python-build-standalone -p "$ASSET" -D /tmp
          tar xzf "/tmp/$ASSET" -C "$P"
          test -f "$P/python/pythonw.exe"
          test -d "$P/python/tcl"
          rm -rf "$P/python/Lib/test" "$P/python/Lib/idlelib" "$P/python/Lib/turtledemo"
          du -sh "$P" "$P/python" "$P/app"
          cat "$P/Instalar Benikids.cmd"

      - uses: actions/upload-artifact@v7
        with:
          name: Beni-Windows
          path: pacote/
          if-no-files-found: error

      # O atualizador do Windows (src/atualizar_windows.py) baixa este zip da Release
      - name: Anexar à Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ github.event.release.tag_name }}"
          test "$(cat pacote/Beni/app/version)" = "${tag#v}"
          (cd pacote && zip -qr ../Benikids-Windows.zip Beni)
          sha256sum Benikids-Windows.zip > Benikids-Windows.zip.sha256
          gh release upload "$tag" Benikids-Windows.zip Benikids-Windows.zip.sha256 --clobber
